<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Artifacts">
<meta name="theme-color" content="#f0a500">
<title>Artifact Manager</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --amber:    #f0a500;
    --amber-lt: #fff3cc;
    --amber-md: #fde68a;
    --bg:       #f9fafb;
    --surface:  #ffffff;
    --border:   #e5e7eb;
    --border2:  #d1d5db;
    --text:     #111827;
    --muted:    #6b7280;
    --muted2:   #9ca3af;
    --green:    #16a34a;
    --green-lt: #dcfce7;
    --red:      #dc2626;
    --red-lt:   #fee2e2;
    --blue:     #2563eb;
    --blue-lt:  #dbeafe;
    --purple:   #7c3aed;
    --purple-lt:#ede9fe;
    --radius:   14px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bot: env(safe-area-inset-bottom, 0px);
  }

  html, body {
    height: 100%;
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }

  /* ── APP SHELL ── */
  .app {
    display: flex;
    flex-direction: column;
    height: 100%;
    max-width: 480px;
    margin: 0 auto;
    background: var(--surface);
  }

  /* ── HEADER ── */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: calc(12px + var(--safe-top)) 16px 12px;
    flex-shrink: 0;
  }
  .header-top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .logo {
    width: 36px; height: 36px;
    background: var(--amber);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  .header-title { font-size: 18px; font-weight: 700; flex: 1; }
  .header-title span { color: var(--amber); }
  .icon-btn {
    width: 40px; height: 40px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; cursor: pointer;
    transition: background .15s;
    flex-shrink: 0;
  }
  .icon-btn:active { background: var(--border); }
  .search-bar {
    display: flex;
    align-items: center;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0 12px;
    gap: 8px;
  }
  .search-bar input {
    flex: 1; border: none; background: transparent;
    padding: 10px 0; font-family: inherit; font-size: 15px;
    color: var(--text); outline: none;
  }
  .search-bar input::placeholder { color: var(--muted2); }
  .search-clear {
    background: none; border: none; color: var(--muted2);
    font-size: 16px; cursor: pointer; padding: 4px;
    display: none;
  }

  /* ── FILTER PILLS ── */
  .filter-row {
    display: flex;
    gap: 6px;
    padding: 10px 16px;
    overflow-x: auto;
    flex-shrink: 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    scrollbar-width: none;
  }
  .filter-row::-webkit-scrollbar { display: none; }
  .pill {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: transparent;
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    white-space: nowrap;
    cursor: pointer;
    transition: all .15s;
    flex-shrink: 0;
  }
  .pill.active {
    background: var(--amber);
    border-color: var(--amber);
    color: #000;
  }

  /* ── CONTENT ── */
  .content {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }

  /* ── EMPTY STATE ── */
  .empty {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 60px 32px; text-align: center; gap: 12px;
  }
  .empty-icon { font-size: 56px; opacity: .6; }
  .empty-title { font-size: 18px; font-weight: 600; }
  .empty-sub { font-size: 14px; color: var(--muted); line-height: 1.5; }
  .empty-btn {
    margin-top: 8px;
    padding: 12px 24px;
    background: var(--amber);
    border: none; border-radius: 12px;
    font-family: inherit; font-size: 15px; font-weight: 600;
    color: #000; cursor: pointer;
  }

  /* ── FOLDER SECTION ── */
  .folder-section { padding: 0 16px; }
  .folder-header {
    display: flex; align-items: center;
    padding: 14px 0 8px;
    gap: 8px; cursor: pointer;
  }
  .folder-icon { font-size: 18px; }
  .folder-name { font-size: 14px; font-weight: 600; flex: 1; }
  .folder-count {
    font-size: 12px; color: var(--muted);
    background: var(--bg); padding: 2px 8px;
    border-radius: 10px; border: 1px solid var(--border);
  }
  .folder-toggle { font-size: 11px; color: var(--muted2); transition: transform .2s; }
  .folder-toggle.collapsed { transform: rotate(-90deg); }

  /* ── ARTIFACT CARD ── */
  .card {
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 8px;
    overflow: hidden;
    transition: border-color .15s;
  }
  .card.expanded { border-color: var(--amber); }
  .card-body {
    display: flex; align-items: center;
    gap: 12px; padding: 14px;
    cursor: pointer;
  }
  .card-icon {
    width: 44px; height: 44px;
    border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
  }
  .card-info { flex: 1; min-width: 0; }
  .card-name {
    font-size: 14px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card-desc {
    font-size: 12px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-top: 2px;
  }
  .card-meta {
    display: flex; align-items: center; gap: 6px;
    margin-top: 5px; flex-wrap: wrap;
  }
  .meta-chip {
    font-size: 11px; padding: 2px 7px;
    border-radius: 6px; font-weight: 500;
  }
  .chip-version { background: var(--amber-lt); color: #92400e; }
  .chip-preferred { background: var(--amber); color: #000; }
  .chip-type { background: var(--blue-lt); color: var(--blue); }
  .chip-tag { background: var(--bg); border: 1px solid var(--border); color: var(--muted); }
  .card-right {
    display: flex; flex-direction: column;
    align-items: center; gap: 6px; flex-shrink: 0;
  }
  .star-btn {
    background: none; border: none;
    font-size: 22px; cursor: pointer;
    line-height: 1; padding: 2px;
    transition: transform .15s;
    color: var(--muted2);
  }
  .star-btn.on { color: var(--amber); }
  .star-btn:active { transform: scale(1.3); }
  .version-badge {
    font-size: 11px; font-weight: 600;
    color: var(--muted); background: var(--surface);
    border: 1px solid var(--border);
    padding: 2px 6px; border-radius: 6px;
  }

  /* ── CARD DETAIL ── */
  .card-detail {
    display: none;
    border-top: 1.5px solid var(--border);
    background: var(--surface);
  }
  .card-detail.open { display: block; }

  .version-list { padding: 8px 14px; }
  .version-item {
    display: flex; align-items: center;
    gap: 10px; padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .version-item:last-child { border-bottom: none; }
  .v-tag {
    font-size: 12px; font-weight: 700;
    padding: 4px 9px; border-radius: 7px;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border);
    flex-shrink: 0; min-width: 36px; text-align: center;
  }
  .v-tag.pref { background: var(--amber); color: #000; border-color: var(--amber); }
  .v-note { flex: 1; font-size: 13px; color: var(--muted); font-style: italic; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .v-star { background: none; border: none; font-size: 18px; color: var(--muted2); cursor: pointer; padding: 4px; flex-shrink: 0; }
  .v-star.on { color: var(--amber); }
  .v-dl { background: none; border: 1px solid var(--border); border-radius: 7px; padding: 5px 10px; font-size: 12px; color: var(--muted); cursor: pointer; flex-shrink: 0; }
  .v-dl:active { background: var(--bg); }

  .card-actions {
    display: flex; gap: 8px; padding: 10px 14px 14px;
    flex-wrap: wrap;
  }
  .action-btn {
    flex: 1; min-width: 80px;
    padding: 10px 8px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    font-family: inherit; font-size: 13px; font-weight: 500;
    color: var(--muted); cursor: pointer;
    text-align: center; transition: all .15s;
  }
  .action-btn:active { background: var(--border); }
  .action-btn.danger { color: var(--red); border-color: #fca5a5; }
  .action-btn.danger:active { background: var(--red-lt); }

  /* ── BOTTOM NAV ── */
  .bottom-nav {
    display: flex;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding-bottom: var(--safe-bot);
    flex-shrink: 0;
  }
  .nav-btn {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 10px 4px;
    background: none; border: none;
    font-family: inherit; cursor: pointer;
    color: var(--muted2); transition: color .15s;
    gap: 3px;
  }
  .nav-btn.active { color: var(--amber); }
  .nav-btn .nav-icon { font-size: 22px; line-height: 1; }
  .nav-btn .nav-label { font-size: 10px; font-weight: 600; }

  /* ── FAB ── */
  .fab {
    position: fixed;
    bottom: calc(72px + var(--safe-bot));
    right: 20px;
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--amber);
    border: none;
    font-size: 26px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(240,165,0,.4);
    transition: transform .15s, box-shadow .15s;
    z-index: 100;
  }
  .fab:active { transform: scale(.93); box-shadow: 0 2px 8px rgba(240,165,0,.3); }

  /* ── SHEETS (bottom drawers) ── */
  .sheet-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.4);
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s;
  }
  .sheet-overlay.show { opacity: 1; pointer-events: all; }

  .sheet {
    position: fixed;
    bottom: 0; left: 50%; transform: translateX(-50%) translateY(100%);
    width: 100%; max-width: 480px;
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    z-index: 201;
    transition: transform .3s cubic-bezier(.4,0,.2,1);
    max-height: 90vh;
    display: flex; flex-direction: column;
    padding-bottom: var(--safe-bot);
  }
  .sheet.show { transform: translateX(-50%) translateY(0); }

  .sheet-handle {
    width: 36px; height: 4px;
    background: var(--border2);
    border-radius: 2px;
    margin: 10px auto 4px;
    flex-shrink: 0;
  }
  .sheet-header {
    padding: 8px 20px 14px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center;
    flex-shrink: 0;
  }
  .sheet-title { font-size: 17px; font-weight: 700; flex: 1; }
  .sheet-close {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 50%; width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; cursor: pointer; color: var(--muted);
  }
  .sheet-body { flex: 1; overflow-y: auto; padding: 16px 20px; }

  /* ── FORM ELEMENTS ── */
  .form-group { margin-bottom: 16px; }
  .form-label {
    font-size: 12px; font-weight: 600;
    color: var(--muted); text-transform: uppercase;
    letter-spacing: .6px; margin-bottom: 6px; display: block;
  }
  .form-input {
    width: 100%;
    padding: 13px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-family: inherit; font-size: 15px;
    color: var(--text); background: var(--bg);
    outline: none; transition: border-color .2s;
  }
  .form-input:focus { border-color: var(--amber); background: var(--surface); }
  .form-input::placeholder { color: var(--muted2); }
  textarea.form-input { min-height: 90px; resize: vertical; line-height: 1.5; }
  select.form-input { cursor: pointer; }
  .form-row { display: flex; gap: 10px; }
  .form-row .form-group { flex: 1; }

  .tag-wrap { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .tag-chip {
    display: flex; align-items: center; gap: 4px;
    padding: 4px 10px; border-radius: 20px;
    background: var(--amber-lt); font-size: 12px;
    font-weight: 500; color: #92400e;
  }
  .tag-chip button { background: none; border: none; cursor: pointer; font-size: 13px; color: #92400e; padding: 0; line-height: 1; }

  .pref-toggle {
    display: flex; align-items: center;
    gap: 10px; padding: 12px 14px;
    background: var(--bg); border: 1.5px solid var(--border);
    border-radius: 10px; cursor: pointer;
    font-size: 14px; font-weight: 500;
  }
  .toggle-switch {
    width: 44px; height: 26px; background: var(--border2);
    border-radius: 13px; margin-left: auto;
    position: relative; transition: background .2s; flex-shrink: 0;
  }
  .toggle-switch::after {
    content: ''; position: absolute;
    width: 20px; height: 20px;
    background: white; border-radius: 50%;
    top: 3px; left: 3px;
    transition: transform .2s;
    box-shadow: 0 1px 4px rgba(0,0,0,.2);
  }
  .toggle-switch.on { background: var(--amber); }
  .toggle-switch.on::after { transform: translateX(18px); }

  .submit-btn {
    width: 100%; padding: 15px;
    background: var(--amber); border: none; border-radius: 12px;
    font-family: inherit; font-size: 16px; font-weight: 700;
    color: #000; cursor: pointer; margin-top: 8px;
    transition: background .15s;
  }
  .submit-btn:active { background: #d4920a; }

  /* ── FOLDERS VIEW ── */
  .folder-grid {
    padding: 16px;
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .folder-card {
    background: var(--bg); border: 1.5px solid var(--border);
    border-radius: var(--radius); padding: 16px 14px;
    cursor: pointer; transition: border-color .15s;
    display: flex; flex-direction: column; gap: 6px;
  }
  .folder-card:active { border-color: var(--amber); }
  .folder-card-icon { font-size: 28px; }
  .folder-card-name { font-size: 14px; font-weight: 600; }
  .folder-card-count { font-size: 12px; color: var(--muted); }
  .folder-card.add-new {
    border-style: dashed; align-items: center; justify-content: center;
    color: var(--muted); font-size: 13px; font-weight: 500;
    flex-direction: row; gap: 6px;
  }

  /* ── STATS VIEW ── */
  .stats-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 10px; padding: 16px;
  }
  .stat-card {
    background: var(--bg); border: 1.5px solid var(--border);
    border-radius: var(--radius); padding: 16px;
    text-align: center;
  }
  .stat-num { font-size: 32px; font-weight: 700; }
  .stat-label { font-size: 12px; color: var(--muted); margin-top: 3px; }

  .export-section { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 8px; }
  .export-btn {
    padding: 14px; border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    font-family: inherit; font-size: 15px; font-weight: 500;
    color: var(--text); cursor: pointer; text-align: left;
    display: flex; align-items: center; gap: 10px;
  }
  .export-btn:active { background: var(--border); }
  .export-btn.danger { color: var(--red); border-color: #fca5a5; }

  /* ── TOAST ── */
  .toast {
    position: fixed; bottom: calc(80px + var(--safe-bot));
    left: 50%; transform: translateX(-50%) translateY(20px);
    background: #1f2937; color: white;
    padding: 10px 20px; border-radius: 24px;
    font-size: 14px; font-weight: 500;
    opacity: 0; transition: all .3s cubic-bezier(.34,1.56,.64,1);
    z-index: 500; white-space: nowrap;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Type colours */
  .ic-html  { background: #fef3c7; }
  .ic-py    { background: #dcfce7; }
  .ic-xlsx  { background: #dbeafe; }
  .ic-docx  { background: #ede9fe; }
  .ic-react { background: #cffafe; }
  .ic-sql   { background: #fee2e2; }
  .ic-json  { background: #f3e8ff; }
  .ic-md    { background: #f0fdf4; }
  .ic-other { background: #f3f4f6; }
</style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div class="header-top">
      <div class="logo">⬡</div>
      <div class="header-title">Artifact<span>Manager</span></div>
      <button class="icon-btn" onclick="openSheet('shareSheet')" title="Save from clipboard">📋</button>
    </div>
    <div class="search-bar">
      <span style="font-size:16px;color:var(--muted2)">🔍</span>
      <input type="search" placeholder="Search artifacts…" id="searchInput" oninput="onSearch(this.value)">
      <button class="search-clear" id="searchClear" onclick="clearSearch()">✕</button>
    </div>
  </div>

  <!-- FILTER PILLS -->
  <div class="filter-row" id="filterRow">
    <button class="pill active" onclick="setFilter('all',this)">All</button>
    <button class="pill" onclick="setFilter('starred',this)">⭐ Starred</button>
    <button class="pill" onclick="setFilter('html',this)">🌐 HTML</button>
    <button class="pill" onclick="setFilter('py',this)">🐍 Python</button>
    <button class="pill" onclick="setFilter('xlsx',this)">📊 Excel</button>
    <button class="pill" onclick="setFilter('docx',this)">📝 Word</button>
    <button class="pill" onclick="setFilter('react',this)">⚛ React</button>
    <button class="pill" onclick="setFilter('sql',this)">🗄 SQL</button>
    <button class="pill" onclick="setFilter('md',this)">📋 MD</button>
  </div>

  <!-- CONTENT -->
  <div class="content" id="mainContent"></div>

  <!-- FAB -->
  <button class="fab" onclick="openSheet('saveSheet')" id="fab">+</button>

  <!-- BOTTOM NAV -->
  <div class="bottom-nav">
    <button class="nav-btn active" id="nav-home" onclick="switchTab('home')">
      <span class="nav-icon">📦</span>
      <span class="nav-label">Artifacts</span>
    </button>
    <button class="nav-btn" id="nav-folders" onclick="switchTab('folders')">
      <span class="nav-icon">📁</span>
      <span class="nav-label">Folders</span>
    </button>
    <button class="nav-btn" id="nav-settings" onclick="switchTab('settings')">
      <span class="nav-icon">⚙️</span>
      <span class="nav-label">Settings</span>
    </button>
  </div>
</div>

<!-- OVERLAY -->
<div class="sheet-overlay" id="overlay" onclick="closeAllSheets()"></div>

<!-- SAVE / EDIT SHEET -->
<div class="sheet" id="saveSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <div class="sheet-title" id="saveSheetTitle">Save Artifact</div>
    <button class="sheet-close" onclick="closeAllSheets()">✕</button>
  </div>
  <div class="sheet-body">
    <input type="hidden" id="editId">
    <div class="form-group">
      <label class="form-label">Name *</label>
      <input class="form-input" id="artName" placeholder="e.g. dashboard.html">
    </div>
    <div class="form-group">
      <label class="form-label">Description</label>
      <input class="form-input" id="artDesc" placeholder="What does it do?">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Version</label>
        <input class="form-input" id="artVersion" placeholder="v1">
      </div>
      <div class="form-group">
        <label class="form-label">Folder</label>
        <select class="form-input" id="artFolder">
          <option value="">None</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Version Note</label>
      <input class="form-input" id="artNote" placeholder="e.g. best layout so far">
    </div>
    <div class="form-group">
      <label class="form-label">Tags</label>
      <input class="form-input" id="artTagInput" placeholder="Type tag and press Enter…" onkeydown="if(event.key==='Enter'){event.preventDefault();addTag()}">
      <div class="tag-wrap" id="tagWrap"></div>
    </div>
    <div class="form-group">
      <label class="form-label">Content</label>
      <textarea class="form-input" id="artContent" placeholder="Paste artifact content here…"></textarea>
    </div>
    <div class="form-group">
      <div class="pref-toggle" onclick="togglePref()">
        <span>⭐ Mark as preferred version</span>
        <div class="toggle-switch" id="prefToggle"></div>
      </div>
    </div>
    <button class="submit-btn" onclick="saveArtifact()">Save Artifact</button>
  </div>
</div>

<!-- SHARE/PASTE SHEET -->
<div class="sheet" id="shareSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <div class="sheet-title">Quick Save from Clipboard</div>
    <button class="sheet-close" onclick="closeAllSheets()">✕</button>
  </div>
  <div class="sheet-body">
    <div class="form-group">
      <label class="form-label">Paste content from Claude</label>
      <textarea class="form-input" id="pasteContent" placeholder="Paste your artifact content here…" style="min-height:140px"></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Name</label>
      <input class="form-input" id="pasteName" placeholder="e.g. dashboard.html">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Version</label>
        <input class="form-input" id="pasteVersion" placeholder="v1">
      </div>
      <div class="form-group">
        <label class="form-label">Folder</label>
        <select class="form-input" id="pasteFolder">
          <option value="">None</option>
        </select>
      </div>
    </div>

  </div>
</div>

<!-- ADD VERSION SHEET -->
<div class="sheet" id="versionSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <div class="sheet-title">Add Version</div>
    <button class="sheet-close" onclick="closeAllSheets()">✕</button>
  </div>
  <div class="sheet-body">
    <input type="hidden" id="versionArtId">
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Version Tag</label>

      <div class="form-group">
        <label class="form-label">Note</label>

    </div>

      <label class="form-label">Content</label>

    </div>

        <span>⭐ Mark as preferred</span>

</div>

<!-- ADD FOLDER SHEET -->
<div class="sheet" id="folderSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <div class="sheet-title">New Folder</div>
    <button class="sheet-close" onclick="closeAllSheets()">✕</button>
  </div>
  <div class="sheet-body">
    <div class="form-group">
      <label class="form-label">Folder Name</label>
      <input class="form-input" id="folderName" placeholder="e.g. Engineering">
    </div>
    <div class="form-group">
      <label class="form-label">Icon</label>
      <div style="display:flex;gap:10px;flex-wrap:wrap" id="iconPicker">
        📁📂💼🔧🎨📊📝🌐🐍⚙️🔬🎯💡🚀🏗️
      </div>
    </div>
    <button class="submit-btn" onclick="saveFolder()">Create Folder</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── DB ────────────────────────────────────────────────────────────────────
let db;
async function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open('ArtifactManagerPWA', 2);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('artifacts')) {
        d.createObjectStore('artifacts', { keyPath: 'id', autoIncrement: true });
      }
      if (!d.objectStoreNames.contains('folders')) {
        const fs = d.createObjectStore('folders', { keyPath: 'id', autoIncrement: true });
        fs.transaction.oncomplete = () => {
          const tx = d.transaction('folders', 'readwrite');
          ['General','Engineering','Finance','Marketing','Legal'].forEach(n =>
            tx.objectStore('folders').add({ name: n, icon: '📁', created: Date.now() })
          );
        };
      }
    };
    req.onsuccess = e => { db = e.target.result; res(db); };
    req.onerror = () => rej(req.error);
  });
}
const dbGetAll = store => new Promise((res,rej) => { const r = db.transaction(store,'readonly').objectStore(store).getAll(); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
const dbGet = (store,key) => new Promise((res,rej) => { const r = db.transaction(store,'readonly').objectStore(store).get(key); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
const dbPut = (store,data) => new Promise((res,rej) => { const r = db.transaction(store,'readwrite').objectStore(store).put(data); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
const dbDel = (store,key) => new Promise((res,rej) => { const r = db.transaction(store,'readwrite').objectStore(store).delete(key); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); });
const dbCount = store => new Promise((res,rej) => { const r = db.transaction(store,'readonly').objectStore(store).count(); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });

// ── STATE ─────────────────────────────────────────────────────────────────
let currentTab = 'home';
let currentFilter = 'all';
let searchTerm = '';
let expandedId = null;
let currentTags = [];
let prefOn = false;
let prefOn2 = false;
let selectedIcon = '📁';

// ── HELPERS ───────────────────────────────────────────────────────────────
const typeOf = n => {
  if (!n) return 'other';
  if (n.endsWith('.py')) return 'py';
  if (n.endsWith('.html')||n.endsWith('.htm')) return 'html';
  if (n.endsWith('.xlsx')||n.endsWith('.xls')||n.endsWith('.csv')) return 'xlsx';
  if (n.endsWith('.docx')||n.endsWith('.doc')) return 'docx';
  if (n.endsWith('.jsx')||n.endsWith('.tsx')||n.endsWith('.react')) return 'react';
  if (n.endsWith('.sql')) return 'sql';
  if (n.endsWith('.json')) return 'json';
  if (n.endsWith('.md')) return 'md';
  return 'other';
};
const emojiOf = t => ({html:'🌐',py:'🐍',xlsx:'📊',docx:'📝',react:'⚛',sql:'🗄',json:'{}',md:'📋',other:'📄'}[t]||'📄');
const fmtDate = ts => {
  const d = new Date(ts), now = new Date();
  const diff = now - d;
  if (diff < 60000) return 'Just now';
  if (diff < 3600000) return Math.floor(diff/60000) + 'm ago';
  if (diff < 86400000) return Math.floor(diff/3600000) + 'h ago';
  if (diff < 604800000) return Math.floor(diff/86400000) + 'd ago';
  return d.toLocaleDateString();
};

// ── RENDER: HOME ──────────────────────────────────────────────────────────
async function renderHome() {
  const [artifacts, folders] = await Promise.all([dbGetAll('artifacts'), dbGetAll('folders')]);
  const folderMap = Object.fromEntries(folders.map(f => [f.id, f]));
  const content = document.getElementById('mainContent');

  let items = artifacts.filter(a => {
    if (currentFilter === 'starred') return a.starred;
    if (currentFilter !== 'all') return typeOf(a.name) === currentFilter;
    return true;
  }).filter(a => {
    if (!searchTerm) return true;
    const q = searchTerm.toLowerCase();
    return a.name.toLowerCase().includes(q) ||
           a.desc?.toLowerCase().includes(q) ||
           a.tags?.some(t => t.includes(q)) ||
           a.versions?.some(v => v.note?.toLowerCase().includes(q));
  }).sort((a,b) => b.createdAt - a.createdAt);

  if (!items.length) {
    content.innerHTML = `
      <div class="empty">
        <div class="empty-icon">${searchTerm ? '🔍' : '📦'}</div>
        <div class="empty-title">${searchTerm ? 'Nothing found' : 'No artifacts yet'}</div>
        <div class="empty-sub">${searchTerm ? 'Try different keywords' : 'Tap + to save your first artifact from Claude'}</div>
        ${!searchTerm ? '<button class="empty-btn" onclick="openSheet(\'saveSheet\')">Save first artifact</button>' : ''}
      </div>`;
    return;
  }

  // Group by folder
  const groups = {};
  items.forEach(a => {
    const key = a.folder ? String(a.folder) : '__none__';
    if (!groups[key]) groups[key] = [];
    groups[key].push(a);
  });

  let html = '';
  // No-folder group first
  if (groups['__none__']) {
    html += `<div class="folder-section">${groups['__none__'].map(a => cardHTML(a, folderMap)).join('')}</div>`;
  }
  // Folder groups
  folders.forEach(f => {
    const key = String(f.id);
    if (!groups[key]) return;
    html += `
      <div class="folder-section">
        <div class="folder-header" onclick="toggleFolderSection('fs-${f.id}')">
          <span class="folder-icon">${f.icon||'📁'}</span>
          <span class="folder-name">${f.name}</span>
          <span class="folder-count">${groups[key].length}</span>
          <span class="folder-toggle" id="ft-${f.id}">▾</span>
        </div>
        <div id="fs-${f.id}">
          ${groups[key].map(a => cardHTML(a, folderMap)).join('')}
        </div>
      </div>`;
  });

  content.innerHTML = html;
}

function toggleFolderSection(id) {
  const el = document.getElementById(id);
  const tog = document.getElementById('ft-' + id.replace('fs-',''));
  const collapsed = el.style.display === 'none';
  el.style.display = collapsed ? 'block' : 'none';
  if (tog) tog.classList.toggle('collapsed', !collapsed);
}

function cardHTML(a, folderMap) {
  const type = typeOf(a.name);
  const pref = a.versions?.find(v => v.preferred);
  const latest = a.versions?.[a.versions.length - 1];
  const isExp = expandedId === a.id;
  return `
  <div class="card ${isExp?'expanded':''}" id="card-${a.id}">
    <div class="card-body" onclick="toggleCard(${a.id})">
      <div class="card-icon ic-${type}">${emojiOf(type)}</div>
      <div class="card-info">
        <div class="card-name">${a.name}</div>
        ${a.desc ? `<div class="card-desc">${a.desc}</div>` : ''}
        <div class="card-meta">
          <span class="meta-chip chip-type">${type.toUpperCase()}</span>
          <span class="meta-chip chip-version">${a.versions?.length||1}v</span>
          ${pref ? `<span class="meta-chip chip-preferred">★ ${pref.v}</span>` : ''}
          <span style="font-size:11px;color:var(--muted2)">${fmtDate(a.createdAt)}</span>
        </div>
      </div>
      <div class="card-right">
        <button class="star-btn ${a.starred?'on':''}" onclick="event.stopPropagation();toggleStar(${a.id})">${a.starred?'⭐':'☆'}</button>
        <span class="version-badge">${latest?.v||'v1'}</span>
      </div>
    </div>
    <div class="card-detail ${isExp?'open':''}" id="detail-${a.id}">
      <div class="version-list">
        ${(a.versions||[]).map((v,i) => `
          <div class="version-item">
            <span class="v-tag ${v.preferred?'pref':''}">${v.v}</span>
            <span class="v-note">${v.note||'—'}</span>
            <button class="v-star ${v.preferred?'on':''}" onclick="setPreferred(${a.id},${i})">${v.preferred?'⭐':'☆'}</button>
            ${v.content ? `<button class="v-dl" onclick="downloadContent('${encodeURIComponent(a.name)}','${i}',${a.id})">⬇</button>` : ''}
          </div>`).join('')}
      </div>
      <div class="card-actions">
        <button class="action-btn" onclick="openAddVersion(${a.id})">+ Version</button>
        <button class="action-btn" onclick="openEdit(${a.id})">✏ Edit</button>
        <button class="action-btn" onclick="copyName(${a.id})">📋 Copy</button>
        <button class="action-btn danger" onclick="deleteArt(${a.id})">🗑 Delete</button>
      </div>
    </div>
  </div>`;
}

async function toggleCard(id) {
  expandedId = expandedId === id ? null : id;
  await renderHome();
  if (expandedId) {
    setTimeout(() => {
      const el = document.getElementById('card-' + id);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, 50);
  }
}

async function toggleStar(id) {
  const a = await dbGet('artifacts', id);
  if (!a) return;
  a.starred = !a.starred;
  await dbPut('artifacts', a);
  toast(a.starred ? '⭐ Starred' : 'Removed from starred');
  await renderHome();
}

async function setPreferred(artId, vIdx) {
  const a = await dbGet('artifacts', artId);
  if (!a) return;
  a.versions.forEach(v => v.preferred = false);
  a.versions[vIdx].preferred = true;
  await dbPut('artifacts', a);
  toast(`★ ${a.versions[vIdx].v} is now preferred`);
  await renderHome();
}

async function deleteArt(id) {
  if (!confirm('Delete this artifact?')) return;
  await dbDel('artifacts', id);
  if (expandedId === id) expandedId = null;
  toast('Artifact deleted');
  await renderHome();
}

async function copyName(id) {
  const a = await dbGet('artifacts', id);
  if (!a) return;
  try {
    await navigator.clipboard.writeText(a.name);
    toast('Name copied');
  } catch { toast('Copy failed — try manually'); }
}

async function downloadContent(encodedName, vIdx, artId) {
  const a = await dbGet('artifacts', artId);
  if (!a) return;
  const v = a.versions[parseInt(vIdx)];
  if (!v?.content) { toast('No content saved for this version'); return; }
  const name = decodeURIComponent(encodedName);
  const blob = new Blob([v.content], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url; link.download = name;
  link.click();
  URL.revokeObjectURL(url);
  toast(`⬇ Downloading ${name}`);
}

// ── RENDER: FOLDERS ───────────────────────────────────────────────────────
async function renderFolders() {
  const [folders, artifacts] = await Promise.all([dbGetAll('folders'), dbGetAll('artifacts')]);
  const counts = {};
  artifacts.forEach(a => { if (a.folder) counts[a.folder] = (counts[a.folder]||0) + 1; });

  const content = document.getElementById('mainContent');
  content.innerHTML = `
    <div class="folder-grid">
      ${folders.map(f => `
        <div class="folder-card" onclick="filterByFolder(${f.id})">
          <div class="folder-card-icon">${f.icon||'📁'}</div>
          <div class="folder-card-name">${f.name}</div>
          <div class="folder-card-count">${counts[f.id]||0} artifact${counts[f.id]!==1?'s':''}</div>
        </div>`).join('')}
      <div class="folder-card add-new" onclick="openSheet('folderSheet')">
        <span style="font-size:22px">+</span> New folder
      </div>
    </div>`;
}

async function filterByFolder(folderId) {
  switchTab('home');
  // scroll to folder section after render
  setTimeout(() => {
    const el = document.getElementById('fs-' + folderId);
    if (el) el.scrollIntoView({ behavior: 'smooth' });
  }, 100);
}

// ── RENDER: SETTINGS ─────────────────────────────────────────────────────
async function renderSettings() {
  const [artCount, folderCount] = await Promise.all([dbCount('artifacts'), dbCount('folders')]);
  const artifacts = await dbGetAll('artifacts');
  const starred = artifacts.filter(a => a.starred).length;
  const versions = artifacts.reduce((s, a) => s + (a.versions?.length||0), 0);

  const content = document.getElementById('mainContent');
  content.innerHTML = `
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-num">${artCount}</div><div class="stat-label">Artifacts</div></div>
      <div class="stat-card"><div class="stat-num">${versions}</div><div class="stat-label">Versions</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--amber)">${starred}</div><div class="stat-label">Starred</div></div>
      <div class="stat-card"><div class="stat-num">${folderCount}</div><div class="stat-label">Folders</div></div>
    </div>
    <div class="export-section">
      <div class="form-label" style="padding:0">Data</div>
      <button class="export-btn" onclick="exportAll()">⬇ Export all as JSON</button>
      <button class="export-btn" onclick="importJSON()">⬆ Import from JSON</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="handleImport(this)">
      <div class="form-label" style="padding:0;margin-top:8px">Privacy</div>
      <div style="font-size:13px;color:var(--muted);line-height:1.6;background:var(--bg);border:1.5px solid var(--border);border-radius:12px;padding:14px">
        All data is stored <strong>locally on this device</strong> in your browser's IndexedDB. Nothing is sent to any server. Your artifacts are yours.
      </div>
      <div class="form-label" style="padding:0;margin-top:8px">Danger zone</div>
      <button class="export-btn danger" onclick="clearAll()">🗑 Clear all data</button>
    </div>`;
}

// ── TABS ──────────────────────────────────────────────────────────────────
async function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-' + tab)?.classList.add('active');
  document.getElementById('fab').style.display = tab === 'home' ? 'flex' : 'none';
  document.getElementById('filterRow').style.display = tab === 'home' ? 'flex' : 'none';

  if (tab === 'home') await renderHome();
  else if (tab === 'folders') await renderFolders();
  else if (tab === 'settings') await renderSettings();
}

// ── SEARCH & FILTER ───────────────────────────────────────────────────────
function onSearch(val) {
  searchTerm = val;
  document.getElementById('searchClear').style.display = val ? 'block' : 'none';
  if (currentTab === 'home') renderHome();
}
function clearSearch() {
  searchTerm = '';
  document.getElementById('searchInput').value = '';
  document.getElementById('searchClear').style.display = 'none';
  renderHome();
}
function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  expandedId = null;
  renderHome();
}

// ── SAVE ARTIFACT ─────────────────────────────────────────────────────────
function togglePref() {
  prefOn = !prefOn;
  document.getElementById('prefToggle').classList.toggle('on', prefOn);
}
function togglePref2() {
  prefOn2 = !prefOn2;
  document.getElementById('prefToggle2').classList.toggle('on', prefOn2);
}

function addTag() {
  const input = document.getElementById('artTagInput');
  const val = input.value.trim().toLowerCase().replace(/\s+/g,'-');
  if (!val || currentTags.includes(val)) { input.value=''; return; }
  currentTags.push(val);
  input.value = '';
  renderTags();
}
function renderTags() {
  document.getElementById('tagWrap').innerHTML = currentTags.map((t,i) => `
    <span class="tag-chip">${t}<button onclick="removeTag(${i})">×</button></span>`).join('');
}
function removeTag(i) { currentTags.splice(i,1); renderTags(); }

async function saveArtifact() {
  const name = document.getElementById('artName').value.trim();
  if (!name) { toast('⚠ Name is required'); return; }

  const editId = document.getElementById('editId').value;
  const desc = document.getElementById('artDesc').value.trim();
  const version = document.getElementById('artVersion').value.trim() || 'v1';
  const note = document.getElementById('artNote').value.trim();
  const folder = document.getElementById('artFolder').value;
  const content = document.getElementById('artContent').value.trim();

  if (editId) {
    // Editing existing
    const a = await dbGet('artifacts', parseInt(editId));
    if (a) {
      a.name = name;
      a.desc = desc;
      a.folder = folder ? parseInt(folder) : null;
      a.tags = [...currentTags];
      await dbPut('artifacts', a);
      toast(`✓ "${name}" updated`);
    }
  } else {
    // New artifact
    await dbPut('artifacts', {
      name, desc,
      folder: folder ? parseInt(folder) : null,
      tags: [...currentTags],
      starred: false,
      createdAt: Date.now(),
      versions: [{ v: version, note: note||'Initial save', content, preferred: prefOn, savedAt: Date.now() }]
    });
    toast(`✓ "${name}" saved`);
  }

  closeAllSheets();
  resetSaveForm();
  if (currentTab === 'home') await renderHome();
}

function resetSaveForm() {
  ['artName','artDesc','artVersion','artNote','artContent','editId'].forEach(id => {
    const el = document.getElementById(id); if (el) el.value='';
  });
  currentTags = [];
  prefOn = false;
  renderTags();
  document.getElementById('prefToggle').classList.remove('on');
  document.getElementById('saveSheetTitle').textContent = 'Save Artifact';
}

async function openEdit(id) {
  const a = await dbGet('artifacts', id);
  if (!a) return;
  resetSaveForm();
  document.getElementById('editId').value = id;
  document.getElementById('artName').value = a.name;
  document.getElementById('artDesc').value = a.desc||'';
  document.getElementById('saveSheetTitle').textContent = 'Edit Artifact';
  currentTags = [...(a.tags||[])];
  renderTags();
  await loadFolderSelects();
  if (a.folder) document.getElementById('artFolder').value = a.folder;
  openSheet('saveSheet');
}

// ── QUICK SAVE ────────────────────────────────────────────────────────────
async function quickSave() {
  const name = document.getElementById('pasteName').value.trim();
  const content = document.getElementById('pasteContent').value.trim();
  const version = document.getElementById('pasteVersion').value.trim() || 'v1';
  const folder = document.getElementById('pasteFolder').value;
  if (!name) { toast('⚠ Name is required'); return; }
  await dbPut('artifacts', {
    name, desc: '', folder: folder ? parseInt(folder) : null,
    tags: [], starred: false, createdAt: Date.now(),
    versions: [{ v: version, note: 'Quick save', content, preferred: false, savedAt: Date.now() }]
  });
  toast(`✓ "${name}" saved`);
  closeAllSheets();
  document.getElementById('pasteName').value = '';
  document.getElementById('pasteContent').value = '';
  document.getElementById('pasteVersion').value = '';
  if (currentTab === 'home') await renderHome();
}

// ── ADD VERSION ───────────────────────────────────────────────────────────
async function openAddVersion(id) {
  const a = await dbGet('artifacts', id);
  if (!a) return;
  document.getElementById('versionArtId').value = id;
  document.getElementById('newVerTag').value = `v${(a.versions?.length||0)+1}`;
  document.getElementById('newVerNote').value = '';
  document.getElementById('newVerContent').value = '';
  prefOn2 = false;
  document.getElementById('prefToggle2').classList.remove('on');
  openSheet('versionSheet');
}

async function saveVersion() {
  const artId = parseInt(document.getElementById('versionArtId').value);
  const tag = document.getElementById('newVerTag').value.trim() || 'v?';
  const note = document.getElementById('newVerNote').value.trim();
  const content = document.getElementById('newVerContent').value.trim();
  const a = await dbGet('artifacts', artId);
  if (!a) return;
  if (prefOn2) a.versions.forEach(v => v.preferred = false);
  a.versions.push({ v: tag, note: note||'New version', content, preferred: prefOn2, savedAt: Date.now() });
  await dbPut('artifacts', a);
  toast(`✓ Version ${tag} added`);
  closeAllSheets();
  if (currentTab === 'home') await renderHome();
}

// ── FOLDERS ───────────────────────────────────────────────────────────────
let selectedIcon = '📁';

async function saveFolder() {
  const name = document.getElementById('folderName').value.trim();
  if (!name) { toast('⚠ Name required'); return; }
  await dbPut('folders', { name, icon: selectedIcon, created: Date.now() });
  document.getElementById('folderName').value = '';
  await loadFolderSelects();
  closeAllSheets();
  toast(`📁 "${name}" created`);
  if (currentTab === 'folders') await renderFolders();
}

async function loadFolderSelects() {
  const folders = await dbGetAll('folders');
  ['artFolder','pasteFolder'].forEach(id => {
    const sel = document.getElementById(id);
    if (!sel) return;
    const cur = sel.value;
    sel.innerHTML = '<option value="">None</option>';
    folders.forEach(f => {
      const o = document.createElement('option');
      o.value = f.id; o.textContent = `${f.icon||'📁'} ${f.name}`;
      sel.appendChild(o);
    });
    sel.value = cur;
  });
}

// Setup icon picker
function setupIconPicker() {
  const picker = document.getElementById('iconPicker');
  if (!picker) return;
  const icons = picker.textContent.trim().split('');
  picker.innerHTML = icons.map(ic => `
    <button onclick="selectFolderIcon('${ic}',this)" style="font-size:28px;background:none;border:2px solid transparent;border-radius:8px;padding:4px;cursor:pointer">${ic}</button>`
  ).join('');
}

function selectFolderIcon(icon, btn) {
  selectedIcon = icon;
  document.querySelectorAll('#iconPicker button').forEach(b => b.style.borderColor = 'transparent');
  btn.style.borderColor = 'var(--amber)';
}

// ── EXPORT / IMPORT ───────────────────────────────────────────────────────
async function exportAll() {
  const [artifacts, folders] = await Promise.all([dbGetAll('artifacts'), dbGetAll('folders')]);
  const data = { exportedAt: new Date().toISOString(), version: '1.0', artifacts, folders };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `artifacts-export-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast(`⬇ Exported ${artifacts.length} artifacts`);
}

function importJSON() { document.getElementById('importFile').click(); }

async function handleImport(input) {
  const file = input.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if (data.folders) {
      for (const f of data.folders) {
        const { id, ...rest } = f;
        await dbPut('folders', rest);
      }
    }
    if (data.artifacts) {
      for (const a of data.artifacts) {
        const { id, ...rest } = a;
        await dbPut('artifacts', rest);
      }
    }
    toast(`✓ Imported ${data.artifacts?.length||0} artifacts`);
    await renderSettings();
  } catch (e) {
    toast('⚠ Import failed — invalid file');
  }
  input.value = '';
}

async function clearAll() {
  if (!confirm('Delete ALL artifacts and folders? This cannot be undone.')) return;
  const tx = db.transaction(['artifacts','folders'], 'readwrite');
  tx.objectStore('artifacts').clear();
  tx.objectStore('folders').clear();
  toast('All data cleared');
  await renderSettings();
  if (currentTab === 'home') await renderHome();
}

// ── SHEETS ────────────────────────────────────────────────────────────────
function openSheet(id) {
  document.getElementById('overlay').classList.add('show');
  document.getElementById(id).classList.add('show');
  if (id === 'saveSheet' || id === 'shareSheet') loadFolderSelects();
  if (id === 'folderSheet') { setupIconPicker(); selectedIcon = '📁'; }
}
function closeAllSheets() {
  document.getElementById('overlay').classList.remove('show');
  document.querySelectorAll('.sheet').forEach(s => s.classList.remove('show'));
}

// ── TOAST ─────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ── SERVICE WORKER ────────────────────────────────────────────────────────
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  navigator.serviceWorker.addEventListener('message', e => {
    if (e.data?.type === 'SHARE') {
      document.getElementById('pasteContent').value = e.data.text;
      document.getElementById('pasteName').value = e.data.title || '';
      openSheet('shareSheet');
    }
  });
}

// ── INIT ──────────────────────────────────────────────────────────────────
openDB().then(async () => {
  await loadFolderSelects();
  await switchTab('home');
  const params = new URLSearchParams(window.location.search);
  if (params.get('shared')) {
    openSheet('shareSheet');
    window.history.replaceState({}, '', window.location.pathname);
  }
}).catch(err => {
  document.getElementById('mainContent').innerHTML = `
    <div class="empty">
      <div class="empty-icon">⚠️</div>
      <div class="empty-title">Storage error</div>
      <div class="empty-sub">Could not open local database: ${err.message || err}<br><br>Try opening in a different browser or check that storage is not blocked.</div>
    </div>`;
});
</script>
