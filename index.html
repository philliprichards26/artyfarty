<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f0a500">
<title>Artifact Manager</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --amber:#f0a500;--amber-lt:#fff3cc;--bg:#f9fafb;--surface:#fff;
  --border:#e5e7eb;--text:#111827;--muted:#6b7280;--muted2:#9ca3af;
  --red:#dc2626;--blue:#2563eb;--radius:14px;
}
html,body{height:100%;font-family:-apple-system,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
.app{display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto;background:var(--surface)}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 16px 10px;flex-shrink:0}
.header-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.logo{width:36px;height:36px;background:var(--amber);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
.header-title{font-size:18px;font-weight:700;flex:1}
.header-title span{color:var(--amber)}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer}
.search-bar{display:flex;align-items:center;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:0 12px;gap:8px}
.search-bar input{flex:1;border:none;background:transparent;padding:10px 0;font-size:15px;color:var(--text);outline:none}
.search-bar input::placeholder{color:var(--muted2)}
.filter-row{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.pill{padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);background:transparent;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap;cursor:pointer;flex-shrink:0}
.pill.active{background:var(--amber);border-color:var(--amber);color:#000}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 32px;text-align:center;gap:12px}
.empty-icon{font-size:56px;opacity:.6}
.empty-title{font-size:18px;font-weight:600}
.empty-sub{font-size:14px;color:var(--muted);line-height:1.5}
.empty-btn{margin-top:8px;padding:12px 24px;background:var(--amber);border:none;border-radius:12px;font-size:15px;font-weight:600;color:#000;cursor:pointer}
.list-wrap{padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.card{background:var(--bg);border:1.5px solid var(--border);border-radius:var(--radius);overflow:hidden}
.card.expanded{border-color:var(--amber)}
.card-body{display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer}
.card-icon{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;background:#f3f4f6}
.card-info{flex:1;min-width:0}
.card-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-desc{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.card-meta{display:flex;align-items:center;gap:5px;margin-top:5px;flex-wrap:wrap}
.chip{font-size:11px;padding:2px 7px;border-radius:6px;font-weight:500}
.chip-type{background:#dbeafe;color:#1d4ed8}
.chip-v{background:#fff3cc;color:#92400e}
.chip-pref{background:var(--amber);color:#000}
.card-right{display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0}
.star-btn{background:none;border:none;font-size:24px;cursor:pointer;line-height:1;color:var(--muted2)}
.star-btn.on{color:var(--amber)}
.vbadge{font-size:11px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--border);padding:2px 6px;border-radius:6px}
.card-detail{display:none;border-top:1.5px solid var(--border);background:var(--surface)}
.card-detail.open{display:block}
.vlist{padding:8px 14px}
.vrow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border)}
.vrow:last-child{border-bottom:none}
.vtag{font-size:12px;font-weight:700;padding:4px 9px;border-radius:7px;background:var(--bg);border:1px solid var(--border);flex-shrink:0;min-width:34px;text-align:center}
.vtag.pref{background:var(--amber);color:#000;border-color:var(--amber)}
.vnote{flex:1;font-size:13px;color:var(--muted);font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vstar{background:none;border:none;font-size:18px;color:var(--muted2);cursor:pointer;padding:4px;flex-shrink:0}
.vstar.on{color:var(--amber)}
.vdl{background:none;border:1px solid var(--border);border-radius:7px;padding:5px 10px;font-size:12px;color:var(--muted);cursor:pointer;flex-shrink:0}
.card-actions{display:flex;gap:8px;padding:10px 14px 14px;flex-wrap:wrap}
.act-btn{flex:1;min-width:70px;padding:10px 8px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;text-align:center}
.act-btn.danger{color:var(--red);border-color:#fca5a5}
.bottom-nav{display:flex;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px;background:none;border:none;cursor:pointer;color:var(--muted2);gap:3px}
.nav-btn.active{color:var(--amber)}
.nav-icon{font-size:22px;line-height:1}
.nav-label{font-size:10px;font-weight:600}
.fab{position:fixed;bottom:74px;right:20px;width:56px;height:56px;border-radius:50%;background:var(--amber);border:none;font-size:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 16px rgba(240,165,0,.4);z-index:50}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:98;opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.show{opacity:1;pointer-events:all}
.sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:480px;background:var(--surface);border-radius:20px 20px 0 0;z-index:99;transition:transform .3s cubic-bezier(.4,0,.2,1);max-height:88vh;display:flex;flex-direction:column}
.sheet.show{transform:translateX(-50%) translateY(0)}
.handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:10px auto 4px;flex-shrink:0}
.sheet-hdr{padding:8px 20px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;flex-shrink:0}
.sheet-title{font-size:17px;font-weight:700;flex:1}
.sheet-close{background:var(--bg);border:1px solid var(--border);border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;color:var(--muted)}
.sheet-body{flex:1;overflow-y:auto;padding:16px 20px}
.fg{margin-bottom:14px}
.fl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px;display:block}
.fi{width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:15px;color:var(--text);background:var(--bg);outline:none;font-family:inherit}
.fi:focus{border-color:var(--amber);background:var(--surface)}
.fi::placeholder{color:var(--muted2)}
textarea.fi{min-height:80px;resize:vertical;line-height:1.5}
select.fi{cursor:pointer}
.frow{display:flex;gap:10px}
.frow .fg{flex:1}
.tags-wrap{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.tag-chip{display:flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;background:var(--amber-lt);font-size:12px;font-weight:500;color:#92400e}
.tag-chip button{background:none;border:none;cursor:pointer;font-size:13px;color:#92400e;padding:0;line-height:1}
.pref-row{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;cursor:pointer;font-size:14px;font-weight:500;margin-bottom:14px}
.tswitch{width:44px;height:26px;background:var(--border);border-radius:13px;margin-left:auto;position:relative;transition:background .2s;flex-shrink:0}
.tswitch::after{content:'';position:absolute;width:20px;height:20px;background:#fff;border-radius:50%;top:3px;left:3px;transition:transform .2s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.tswitch.on{background:var(--amber)}
.tswitch.on::after{transform:translateX(18px)}
.sub-btn{width:100%;padding:15px;background:var(--amber);border:none;border-radius:12px;font-size:16px;font-weight:700;color:#000;cursor:pointer;margin-top:4px}
.folder-grid{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fcard{background:var(--bg);border:1.5px solid var(--border);border-radius:var(--radius);padding:16px 14px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.fcard-icon{font-size:28px}
.fcard-name{font-size:14px;font-weight:600}
.fcard-count{font-size:12px;color:var(--muted)}
.fcard.add{border-style:dashed;align-items:center;justify-content:center;color:var(--muted);font-size:13px;font-weight:500;flex-direction:row;gap:6px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px}
.scard{background:var(--bg);border:1.5px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center}
.snum{font-size:32px;font-weight:700}
.slabel{font-size:12px;color:var(--muted);margin-top:3px}
.exp-sec{padding:0 16px 16px;display:flex;flex-direction:column;gap:8px}
.exp-btn{padding:14px;border-radius:12px;border:1.5px solid var(--border);background:var(--bg);font-size:15px;font-weight:500;color:var(--text);cursor:pointer;text-align:left;display:flex;align-items:center;gap:10px;font-family:inherit}
.exp-btn.danger{color:var(--red);border-color:#fca5a5}
.toast{position:fixed;bottom:82px;left:50%;transform:translateX(-50%) translateY(20px);background:#1f2937;color:#fff;padding:10px 20px;border-radius:24px;font-size:14px;font-weight:500;opacity:0;transition:all .3s cubic-bezier(.34,1.56,.64,1);z-index:999;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.icon-grid{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.icon-opt{font-size:28px;background:none;border:2px solid transparent;border-radius:8px;padding:4px;cursor:pointer}
.icon-opt.sel{border-color:var(--amber)}
.privacy-box{font-size:13px;color:var(--muted);line-height:1.6;background:var(--bg);border:1.5px solid var(--border);border-radius:12px;padding:14px;margin-bottom:8px}

.rebuild-box{background:#f0fdf4;border:1.5px solid #bbf7d0;border-radius:10px;padding:10px 12px;margin:0 14px 10px;font-size:12px;color:#166534;display:none}
.rebuild-box.show{display:block}
.rebuild-prompt{font-family:monospace;font-size:11px;background:#dcfce7;border-radius:6px;padding:8px;margin:6px 0;line-height:1.5;word-break:break-word}
.copy-prompt-btn{padding:8px 14px;background:#16a34a;border:none;border-radius:7px;color:#fff;font-size:12px;font-weight:600;cursor:pointer;width:100%;margin-top:4px}
.attach-indicator{font-size:11px;font-weight:500;margin-top:2px}
.attach-ok{color:#16a34a}
.attach-no{color:var(--muted2)}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-top">
      <div class="logo">⬡</div>
      <div class="header-title">Artifact<span>Manager</span></div>
      <div class="icon-btn" onclick="openSheet('shareSheet')">📋</div>
    </div>
    <div class="search-bar">
      <span style="font-size:16px;color:var(--muted2)">🔍</span>
      <input type="search" placeholder="Search artifacts…" id="searchInput" oninput="onSearch(this.value)">
    </div>
  </div>

  <div class="filter-row">
    <button class="pill active" onclick="setFilter('all',this)">All</button>
    <button class="pill" onclick="setFilter('starred',this)">⭐ Starred</button>
    <button class="pill" onclick="setFilter('html',this)">🌐 HTML</button>
    <button class="pill" onclick="setFilter('py',this)">🐍 Python</button>
    <button class="pill" onclick="setFilter('xlsx',this)">📊 Excel</button>
    <button class="pill" onclick="setFilter('docx',this)">📝 Word</button>
    <button class="pill" onclick="setFilter('sql',this)">🗄 SQL</button>
    <button class="pill" onclick="setFilter('md',this)">📋 MD</button>
  </div>

  <div class="content" id="content"></div>

  <button class="fab" id="fab" onclick="openSheet('saveSheet')">+</button>

  <div class="bottom-nav">
    <button class="nav-btn active" id="nav-home" onclick="switchTab('home')">
      <span class="nav-icon">📦</span><span class="nav-label">Artifacts</span>
    </button>
    <button class="nav-btn" id="nav-folders" onclick="switchTab('folders')">
      <span class="nav-icon">📁</span><span class="nav-label">Folders</span>
    </button>
    <button class="nav-btn" id="nav-settings" onclick="switchTab('settings')">
      <span class="nav-icon">⚙️</span><span class="nav-label">Settings</span>
    </button>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closeSheets()"></div>

<div class="sheet" id="saveSheet">
  <div class="handle"></div>
  <div class="sheet-hdr">
    <div class="sheet-title" id="saveTitle">Save Artifact</div>
    <div class="sheet-close" onclick="closeSheets()">✕</div>
  </div>
  <div class="sheet-body">
    <input type="hidden" id="editId">
    <div class="fg"><label class="fl">Name *</label><input class="fi" id="artName" placeholder="e.g. dashboard.html"></div>
    <div class="fg"><label class="fl">Description</label><input class="fi" id="artDesc" placeholder="What does it do?"></div>
    <div class="frow">
      <div class="fg"><label class="fl">Version</label><input class="fi" id="artVer" placeholder="v1"></div>
      <div class="fg"><label class="fl">Folder</label><select class="fi" id="artFolder"><option value="">None</option></select></div>
    </div>
    <div class="fg"><label class="fl">Version Note</label><input class="fi" id="artNote" placeholder="e.g. best layout so far"></div>
    <div class="fg">
      <label class="fl">Tags (press Enter)</label>
      <input class="fi" id="tagInput" placeholder="Add tag…" onkeydown="if(event.key==='Enter'){event.preventDefault();addTag()}">
      <div class="tags-wrap" id="tagsWrap"></div>
    </div>
    <div class="fg"><label class="fl">Content</label><textarea class="fi" id="artContent" placeholder="Paste artifact content…"></textarea></div>
    <div class="pref-row" onclick="togglePref('pref1')"><span>⭐ Mark as preferred version</span><div class="tswitch" id="pref1"></div></div>
    <button class="sub-btn" onclick="saveArtifact()">💾 Save Artifact</button>
  </div>
</div>

<div class="sheet" id="shareSheet">
  <div class="handle"></div>
  <div class="sheet-hdr">
    <div class="sheet-title">Quick Save</div>
    <div class="sheet-close" onclick="closeSheets()">✕</div>
  </div>
  <div class="sheet-body">
    <div class="fg"><label class="fl">Paste content from Claude</label><textarea class="fi" id="pasteContent" placeholder="Paste here…" style="min-height:120px"></textarea></div>
    <div class="fg"><label class="fl">Name</label><input class="fi" id="pasteName" placeholder="e.g. my-script.py"></div>
    <div class="frow">
      <div class="fg"><label class="fl">Version</label><input class="fi" id="pasteVer" placeholder="v1"></div>
      <div class="fg"><label class="fl">Folder</label><select class="fi" id="pasteFolder"><option value="">None</option></select></div>
    </div>
    <button class="sub-btn" onclick="quickSave()">💾 Save</button>
  </div>
</div>

<div class="sheet" id="verSheet">
  <div class="handle"></div>
  <div class="sheet-hdr">
    <div class="sheet-title">Add Version</div>
    <div class="sheet-close" onclick="closeSheets()">✕</div>
  </div>
  <div class="sheet-body">
    <input type="hidden" id="verArtId">
    <div class="frow">
      <div class="fg"><label class="fl">Version</label><input class="fi" id="verTag" placeholder="v2"></div>
      <div class="fg"><label class="fl">Note</label><input class="fi" id="verNote" placeholder="What changed?"></div>
    </div>
    <div class="fg"><label class="fl">Content</label><textarea class="fi" id="verContent" placeholder="Paste new version…"></textarea></div>
    <div class="pref-row" onclick="togglePref('pref2')"><span>⭐ Mark as preferred</span><div class="tswitch" id="pref2"></div></div>
    <button class="sub-btn" onclick="saveVersion()">Add Version</button>
  </div>
</div>

<div class="sheet" id="folderSheet">
  <div class="handle"></div>
  <div class="sheet-hdr">
    <div class="sheet-title">New Folder</div>
    <div class="sheet-close" onclick="closeSheets()">✕</div>
  </div>
  <div class="sheet-body">
    <div class="fg"><label class="fl">Name</label><input class="fi" id="folderName" placeholder="e.g. Engineering"></div>
    <div class="fg"><label class="fl">Icon</label><div class="icon-grid" id="iconGrid"></div></div>
    <button class="sub-btn" onclick="saveFolder()">Create Folder</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// localStorage storage
const AKEY='cam_arts', FKEY='cam_folders', IDKEY='cam_nid';
const getArts=()=>{try{return JSON.parse(localStorage.getItem(AKEY)||'[]')}catch{return[]}};
const getFolders=()=>{try{return JSON.parse(localStorage.getItem(FKEY)||'[]')}catch{return[]}};
const setArts=d=>localStorage.setItem(AKEY,JSON.stringify(d));
const setFolders=d=>localStorage.setItem(FKEY,JSON.stringify(d));
let nid=parseInt(localStorage.getItem(IDKEY)||'1');
const newId=()=>{const i=nid++;localStorage.setItem(IDKEY,nid);return i};

// Init folders
if(!localStorage.getItem(FKEY)){
  setFolders([{id:1,name:'General',icon:'📁'},{id:2,name:'Engineering',icon:'🔧'},{id:3,name:'Finance',icon:'💰'},{id:4,name:'Marketing',icon:'🎨'},{id:5,name:'Legal',icon:'⚖️'}]);
}

// State
let tab='home',filter='all',search='',expanded=null,tags=[],prefs={pref1:false,pref2:false},selIcon='📁';

// Helpers
const typeOf=n=>{if(!n)return'other';n=n.toLowerCase();if(n.endsWith('.py'))return'py';if(n.endsWith('.html')||n.endsWith('.htm'))return'html';if(n.endsWith('.xlsx')||n.endsWith('.xls')||n.endsWith('.csv'))return'xlsx';if(n.endsWith('.docx')||n.endsWith('.doc'))return'docx';if(n.endsWith('.jsx')||n.endsWith('.tsx'))return'react';if(n.endsWith('.sql'))return'sql';if(n.endsWith('.json'))return'json';if(n.endsWith('.md'))return'md';return'other'};
const emojiOf=t=>({html:'🌐',py:'🐍',xlsx:'📊',docx:'📝',react:'⚛',sql:'🗄',json:'{}',md:'📋',other:'📄'}[t]||'📄');
const fmtDate=ts=>{const d=Date.now()-ts;if(d<60000)return'Just now';if(d<3600000)return Math.floor(d/60000)+'m ago';if(d<86400000)return Math.floor(d/3600000)+'h ago';if(d<604800000)return Math.floor(d/86400000)+'d ago';return new Date(ts).toLocaleDateString()};

function renderHome(){
  let arts=getArts().filter(a=>{
    if(filter==='starred')return a.starred;
    if(filter!=='all')return typeOf(a.name)===filter;
    return true;
  }).filter(a=>{
    if(!search)return true;
    const q=search.toLowerCase();
    return a.name.toLowerCase().includes(q)||(a.desc||'').toLowerCase().includes(q)||(a.tags||[]).some(t=>t.includes(q))||(a.versions||[]).some(v=>(v.note||'').toLowerCase().includes(q));
  }).sort((a,b)=>b.createdAt-a.createdAt);
  const c=document.getElementById('content');
  if(!arts.length){c.innerHTML=`<div class="empty"><div class="empty-icon">${search?'🔍':'📦'}</div><div class="empty-title">${search?'Nothing found':'No artifacts yet'}</div><div class="empty-sub">${search?'Try different keywords':'Tap + to save your first artifact'}</div>${!search?'<button class="empty-btn" onclick="openSheet(\'saveSheet\')">Save first artifact</button>':''}</div>`;return}
  c.innerHTML=`<div class="list-wrap">${arts.map(a=>{
    const type=typeOf(a.name),pref=(a.versions||[]).find(v=>v.preferred),latest=(a.versions||[])[(a.versions||[]).length-1],isExp=expanded===a.id,hasFile=(a.versions||[]).some(v=>v.content&&v.content.length>0);
    return`<div class="card ${isExp?'expanded':''}" id="card-${a.id}">
      <div class="card-body" onclick="toggleCard(${a.id})">
        <div class="card-icon">${emojiOf(type)}</div>
        <div class="card-info">
          <div class="card-name">${a.name}</div>
          ${a.desc?`<div class="card-desc">${a.desc}</div>`:''}
          <div class="card-meta">
            <span class="chip chip-type">${type.toUpperCase()}</span>
            <span class="chip chip-v">${(a.versions||[]).length}v</span>
            ${pref?`<span class="chip chip-pref">★ ${pref.v}</span>`:''}
            <span style="font-size:11px;color:var(--muted2)">${fmtDate(a.createdAt)}</span>
          </div>
          <div class="attach-indicator ${hasFile?'attach-ok':'attach-no'}">${hasFile?'📎 File attached':'📎 No file'}</div>
        </div>
        <div class="card-right">
          <button class="star-btn ${a.starred?'on':''}" onclick="event.stopPropagation();toggleStar(${a.id})">${a.starred?'⭐':'☆'}</button>
          <span class="vbadge">${latest?latest.v:'v1'}</span>
        </div>
      </div>
      <div class="card-detail ${isExp?'open':''}" id="det-${a.id}">
        <div class="vlist">
          ${(a.versions||[]).map((v,i)=>`<div class="vrow"><span class="vtag ${v.preferred?'pref':''}">${v.v}</span><span class="vnote">${v.note||'—'}</span><button class="vstar ${v.preferred?'on':''}" onclick="setPref(${a.id},${i})">${v.preferred?'⭐':'☆'}</button>${v.content?`<button class="vdl" onclick="dlVer(${a.id},${i})">⬇</button>`:''}</div>`).join('')}
        </div>
        <div class="card-actions">
          <button class="act-btn" onclick="openAddVer(${a.id})">+ Version</button>
          <button class="act-btn" onclick="openEdit(${a.id})">✏ Edit</button>
          <button class="act-btn" onclick="triggerAttach(${a.id})">📎 Attach</button>
          <button class="act-btn" onclick="showRebuild(${a.id})">🤖 Rebuild</button>
          <button class="act-btn danger" onclick="delArt(${a.id})">🗑</button>
        </div>
        <input type="file" id="attach-${a.id}" style="display:none" onchange="attachFile(${a.id},this)">
        <div class="rebuild-box" id="rebuild-${a.id}">
          <div style="font-weight:600;margin-bottom:4px">📋 Copy this prompt into Claude:</div>
          <div class="rebuild-prompt">${buildRebuildPrompt(a)}</div>
          <button class="copy-prompt-btn" onclick="copyRebuildPrompt(${a.id})">📋 Copy Prompt</button>
        </div>
      </div>
    </div>`;
  }).join('')}</div>`;
}

function toggleCard(id){expanded=expanded===id?null:id;renderHome();if(expanded)setTimeout(()=>{const el=document.getElementById('card-'+id);if(el)el.scrollIntoView({behavior:'smooth',block:'nearest'})},50)}
function toggleStar(id){const arts=getArts(),a=arts.find(x=>x.id===id);if(!a)return;a.starred=!a.starred;setArts(arts);showToast(a.starred?'⭐ Starred':'Removed');renderHome()}
function setPref(artId,vIdx){const arts=getArts(),a=arts.find(x=>x.id===artId);if(!a)return;a.versions.forEach(v=>v.preferred=false);a.versions[vIdx].preferred=true;setArts(arts);showToast(`★ ${a.versions[vIdx].v} preferred`);renderHome()}
function delArt(id){if(!confirm('Delete this artifact?'))return;setArts(getArts().filter(a=>a.id!==id));if(expanded===id)expanded=null;showToast('Deleted');renderHome()}
function dlVer(artId,vIdx){const a=getArts().find(x=>x.id===artId);if(!a||!a.versions[vIdx]?.content){showToast('No content saved');return}const v=a.versions[vIdx];const blob=new Blob([v.content],{type:'text/plain'});const url=URL.createObjectURL(blob);const l=document.createElement('a');l.href=url;l.download=a.name;l.click();URL.revokeObjectURL(url);showToast('⬇ Downloading…')}

function renderFolders(){
  const folders=getFolders(),arts=getArts(),counts={};
  arts.forEach(a=>{if(a.folder)counts[a.folder]=(counts[a.folder]||0)+1});
  document.getElementById('content').innerHTML=`<div class="folder-grid">${folders.map(f=>`<div class="fcard" onclick="switchTab('home')"><div class="fcard-icon">${f.icon||'📁'}</div><div class="fcard-name">${f.name}</div><div class="fcard-count">${counts[f.id]||0} artifact${counts[f.id]!==1?'s':''}</div></div>`).join('')}<div class="fcard add" onclick="openSheet('folderSheet')"><span style="font-size:22px">+</span> New</div></div>`;
}

function renderSettings(){
  const arts=getArts(),folders=getFolders();
  document.getElementById('content').innerHTML=`<div class="stats-grid"><div class="scard"><div class="snum">${arts.length}</div><div class="slabel">Artifacts</div></div><div class="scard"><div class="snum">${arts.reduce((s,a)=>s+(a.versions?.length||0),0)}</div><div class="slabel">Versions</div></div><div class="scard"><div class="snum" style="color:var(--amber)">${arts.filter(a=>a.starred).length}</div><div class="slabel">Starred</div></div><div class="scard"><div class="snum">${folders.length}</div><div class="slabel">Folders</div></div></div><div class="exp-sec"><div class="privacy-box">🔒 All data stored <strong>locally on this device</strong>. Nothing sent to any server.</div><button class="exp-btn" onclick="exportAll()">⬇ Export all as JSON</button><button class="exp-btn" onclick="document.getElementById('importFile').click()">⬆ Import from JSON</button><input type="file" id="importFile" accept=".json" style="display:none" onchange="handleImport(this)"><button class="exp-btn danger" onclick="clearAll()">🗑 Clear all data</button></div>`;
}

function switchTab(t){
  tab=t;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('nav-'+t)?.classList.add('active');
  document.getElementById('fab').style.display=t==='home'?'flex':'none';
  document.querySelector('.filter-row').style.display=t==='home'?'flex':'none';
  if(t==='home')renderHome();
  else if(t==='folders')renderFolders();
  else if(t==='settings')renderSettings();
}

function onSearch(v){search=v;if(tab==='home')renderHome()}
function setFilter(f,el){filter=f;expanded=null;document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));el.classList.add('active');renderHome()}
function togglePref(id){prefs[id]=!prefs[id];document.getElementById(id).classList.toggle('on',prefs[id])}

function addTag(){const inp=document.getElementById('tagInput'),v=inp.value.trim().toLowerCase().replace(/\s+/g,'-');if(!v||tags.includes(v)){inp.value='';return}tags.push(v);inp.value='';renderTags()}
function renderTags(){document.getElementById('tagsWrap').innerHTML=tags.map((t,i)=>`<span class="tag-chip">${t}<button onclick="removeTag(${i})">×</button></span>`).join('')}
function removeTag(i){tags.splice(i,1);renderTags()}

function loadFolderSelects(){
  const folders=getFolders();
  ['artFolder','pasteFolder'].forEach(id=>{
    const sel=document.getElementById(id);if(!sel)return;
    const cur=sel.value;sel.innerHTML='<option value="">None</option>';
    folders.forEach(f=>{const o=document.createElement('option');o.value=f.id;o.textContent=`${f.icon} ${f.name}`;sel.appendChild(o)});
    sel.value=cur;
  });
}

function saveArtifact(){
  const name=document.getElementById('artName').value.trim();
  if(!name){showToast('⚠ Name required');return}
  const editId=document.getElementById('editId').value;
  const desc=document.getElementById('artDesc').value.trim();
  const ver=document.getElementById('artVer').value.trim()||'v1';
  const note=document.getElementById('artNote').value.trim();
  const folder=document.getElementById('artFolder').value;
  const content=document.getElementById('artContent').value.trim();
  const arts=getArts();
  if(editId){
    const a=arts.find(x=>x.id===parseInt(editId));
    if(a){a.name=name;a.desc=desc;a.folder=folder?parseInt(folder):null;a.tags=[...tags]}
    setArts(arts);showToast(`✓ "${name}" updated`);
  }else{
    arts.push({id:newId(),name,desc,folder:folder?parseInt(folder):null,tags:[...tags],starred:false,createdAt:Date.now(),versions:[{v:ver,note:note||'Initial save',content,preferred:prefs.pref1,savedAt:Date.now()}]});
    setArts(arts);showToast(`✓ "${name}" saved`);
  }
  closeSheets();resetSaveForm();if(tab==='home')renderHome();
}

function resetSaveForm(){
  ['artName','artDesc','artVer','artNote','artContent','editId'].forEach(id=>{const el=document.getElementById(id);if(el)el.value=''});
  tags=[];prefs.pref1=false;renderTags();
  document.getElementById('pref1').classList.remove('on');
  document.getElementById('saveTitle').textContent='Save Artifact';
}

function openEdit(id){
  const a=getArts().find(x=>x.id===id);if(!a)return;
  resetSaveForm();
  document.getElementById('editId').value=id;
  document.getElementById('artName').value=a.name;
  document.getElementById('artDesc').value=a.desc||'';
  document.getElementById('saveTitle').textContent='Edit Artifact';
  tags=[...(a.tags||[])];renderTags();loadFolderSelects();
  if(a.folder)document.getElementById('artFolder').value=a.folder;
  openSheet('saveSheet');
}

function quickSave(){
  const name=document.getElementById('pasteName').value.trim();
  if(!name){showToast('⚠ Name required');return}
  const content=document.getElementById('pasteContent').value.trim();
  const ver=document.getElementById('pasteVer').value.trim()||'v1';
  const folder=document.getElementById('pasteFolder').value;
  const arts=getArts();
  arts.push({id:newId(),name,desc:'',folder:folder?parseInt(folder):null,tags:[],starred:false,createdAt:Date.now(),versions:[{v:ver,note:'Quick save',content,preferred:false,savedAt:Date.now()}]});
  setArts(arts);showToast(`✓ "${name}" saved`);
  closeSheets();
  ['pasteName','pasteContent','pasteVer'].forEach(id=>document.getElementById(id).value='');
  if(tab==='home')renderHome();
}

function openAddVer(id){
  const a=getArts().find(x=>x.id===id);if(!a)return;
  document.getElementById('verArtId').value=id;
  document.getElementById('verTag').value=`v${(a.versions?.length||0)+1}`;
  document.getElementById('verNote').value='';document.getElementById('verContent').value='';
  prefs.pref2=false;document.getElementById('pref2').classList.remove('on');
  openSheet('verSheet');
}

function saveVersion(){
  const artId=parseInt(document.getElementById('verArtId').value);
  const tag=document.getElementById('verTag').value.trim()||'v?';
  const note=document.getElementById('verNote').value.trim();
  const content=document.getElementById('verContent').value.trim();
  const arts=getArts(),a=arts.find(x=>x.id===artId);if(!a)return;
  if(prefs.pref2)a.versions.forEach(v=>v.preferred=false);
  a.versions.push({v:tag,note:note||'New version',content,preferred:prefs.pref2,savedAt:Date.now()});
  setArts(arts);showToast(`✓ Version ${tag} added`);closeSheets();if(tab==='home')renderHome();
}

const ICONS=['📁','📂','💼','🔧','🎨','📊','📝','🌐','🐍','⚙️','🔬','🎯','💡','🚀','💰','⚖️','🏗️','📱'];
function setupIconGrid(){document.getElementById('iconGrid').innerHTML=ICONS.map(ic=>`<button class="icon-opt ${ic===selIcon?'sel':''}" onclick="selectIcon('${ic}',this)">${ic}</button>`).join('')}
function selectIcon(icon,btn){selIcon=icon;document.querySelectorAll('.icon-opt').forEach(b=>b.classList.remove('sel'));btn.classList.add('sel')}

function saveFolder(){
  const name=document.getElementById('folderName').value.trim();if(!name){showToast('⚠ Name required');return}
  const folders=getFolders();
  const id=Math.max(0,...folders.map(f=>f.id))+1;
  folders.push({id,name,icon:selIcon});setFolders(folders);
  document.getElementById('folderName').value='';loadFolderSelects();closeSheets();
  showToast(`📁 "${name}" created`);if(tab==='folders')renderFolders();
}

function exportAll(){
  const data={exportedAt:new Date().toISOString(),artifacts:getArts(),folders:getFolders()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download=`artifacts-${new Date().toISOString().slice(0,10)}.json`;
  a.click();URL.revokeObjectURL(url);showToast(`⬇ Exported ${getArts().length} artifacts`);
}

function handleImport(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{try{const data=JSON.parse(e.target.result);if(data.folders)setFolders(data.folders);if(data.artifacts)setArts(data.artifacts);showToast(`✓ Imported ${data.artifacts?.length||0} artifacts`);renderSettings()}catch{showToast('⚠ Invalid file')}};
  reader.readAsText(file);input.value='';
}

function clearAll(){if(!confirm('Delete ALL data?'))return;[AKEY,FKEY,IDKEY].forEach(k=>localStorage.removeItem(k));nid=1;showToast('Cleared');renderSettings()}

function openSheet(id){
  document.getElementById('overlay').classList.add('show');
  document.getElementById(id).classList.add('show');
  if(id==='saveSheet'||id==='shareSheet')loadFolderSelects();
  if(id==='folderSheet'){selIcon='📁';setupIconGrid()}
}
function closeSheets(){
  document.getElementById('overlay').classList.remove('show');
  document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('show'));
}

let toastTimer;
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2500)}

loadFolderSelects();
switchTab('home');

// ── FILE ATTACH ───────────────────────────────────────────────────────────
function triggerAttach(id){
  const inp=document.getElementById('attach-'+id);
  if(inp)inp.click();
}

function attachFile(artId,input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const arts=getArts(),a=arts.find(x=>x.id===artId);if(!a)return;
    // Attach to latest version
    const latest=a.versions[a.versions.length-1];
    if(latest){
      latest.content=e.target.result;
      latest.fileName=file.name;
      latest.fileSize=file.size;
    }
    setArts(arts);
    showToast(`📎 "${file.name}" attached`);
    renderHome();
  };
  reader.readAsText(file);
  input.value='';
}

// ── REBUILD PROMPT ────────────────────────────────────────────────────────
function buildRebuildPrompt(a){
  const pref=(a.versions||[]).find(v=>v.preferred)||a.versions?.[a.versions.length-1];
  const ver=pref?pref.v:'latest version';
  const note=pref?.note?` (${pref.note})`:'';
  return `Please re-send or rebuild "${a.name}" ${ver}${note}. ${a.desc||''}`.trim();
}

function showRebuild(id){
  const box=document.getElementById('rebuild-'+id);
  if(!box)return;
  box.classList.toggle('show');
}

function copyRebuildPrompt(id){
  const a=getArts().find(x=>x.id===id);if(!a)return;
  const prompt=buildRebuildPrompt(a);
  if(navigator.clipboard){
    navigator.clipboard.writeText(prompt).then(()=>showToast('📋 Prompt copied — paste into Claude!')).catch(()=>fallbackCopy(prompt));
  } else { fallbackCopy(prompt); }
}

function fallbackCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');showToast('📋 Prompt copied!')}catch{showToast('⚠ Copy manually from the box')}
  document.body.removeChild(ta);
}

</script>
</body>
</html>
